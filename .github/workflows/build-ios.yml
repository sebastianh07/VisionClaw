# Builds an UNSIGNED .ipa on a free GitHub macOS runner.
# Sign and install it from Windows with Sideloadly (free Apple ID).
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [glasses-agent]

# Only one build at a time: a newer push cancels an older queued or running build.
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # GitHub's Apple-silicon (arm64) macOS runners were over capacity on 2026-11-12:
    # jobs sat queued 15 minutes, then failed with "not acquired by Runner of type hosted".
    # The Intel runners are a separate pool. Two are tried; either one producing the IPA is enough.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26 on this runner
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Placeholder secrets (real keys are typed into the app's Settings screen)
        working-directory: samples/CameraAccess
        run: cp CameraAccess/Secrets.swift.example CameraAccess/Secrets.swift

      # Glasses toolkit settings for Meta AI's Developer Mode (Info.plist > MWDAT):
      #   MetaAppID "0"  - the Developer Mode value (same as the Android app uses)
      #   ClientToken "" - not used in Developer Mode
      #   TeamID ""      - the project's original team ID belongs to the upstream author and
      #                    never matches a sideloaded build, so it is left empty
      - name: Build without code signing
        working-directory: samples/CameraAccess
        run: |
          set -o pipefail
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            META_APP_ID=0 CLIENT_TOKEN="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|Resolve Package|Fetching|Compiling|Linking" | tail -n 400

      - name: Package IPA
        working-directory: samples/CameraAccess
        run: |
          echo "Glasses toolkit settings in the built app:"
          /usr/libexec/PlistBuddy -c "Print :MWDAT" build/Build/Products/Release-iphoneos/CameraAccess.app/Info.plist
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CameraAccess.app Payload/
          zip -qry VisionClaw-unsigned.ipa Payload
          ls -lh VisionClaw-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-unsigned-ipa-${{ matrix.os }}
          path: samples/CameraAccess/VisionClaw-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.os }}
          path: samples/CameraAccess/xcodebuild.log
